
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Stake - Dematagoda</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:15px;color:#172033}
main{max-width:650px;margin:auto}
h1{text-align:center;color:#123b70;font-size:25px}
.panel{background:white;padding:16px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
label{display:block;font-weight:bold;margin:12px 0 5px}
input,button{width:100%;padding:12px;font-size:16px;border-radius:8px}
input{border:1px solid #cbd5e1}
button{border:0;background:#1559a6;color:white;font-weight:bold;margin-top:10px}
.clear{background:#64748b}
.total{font-size:23px;color:#087443;font-weight:bold}
.record{padding:12px 0;border-bottom:1px solid #ddd;overflow-wrap:anywhere}
.small{font-size:13px;color:#475569}
</style>
</head>
<body>
<main>
<h1>Daily Stake - Dematagoda</h1>

<section class="panel">
<h2>Admin - Daily Entry</h2>
<p class="small">Enter amounts, then save. Due is not included in Total.</p>

<label for="date">Date</label>
<input id="date" type="date">

<label for="australian">Australian</label>
<input id="australian" type="number" min="0" step="any" value="0">

<label for="england">England</label>
<input id="england" type="number" min="0" step="any" value="0">

<label for="tackside">Tackside</label>
<input id="tackside" type="number" min="0" step="any" value="0">

<label for="due">Due (not included in total)</label>
<input id="due" type="number" min="0" step="any" value="0">

<p>Total Daily Stake</p>
<div class="total" id="total">0</div>

<button id="saveBtn" onclick="saveRecord()">Save Daily Stake</button>
<button class="clear" onclick="clearAmounts()">Clear Amounts</button>
<p id="status" role="status"></p>
</section>

<section class="panel">
<h2>Saved Records</h2>
<label for="searchDate">Search by date (optional)</label>
<input id="searchDate" type="date" onchange="showRecords()">
<button onclick="document.getElementById('searchDate').value='';showRecords()">Show All Records</button>
<div id="records">Loading records...</div>
</section>
</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxweNwVKbgMgK187bpmFaDdR3tcalJjSLs65CEoCsvDqi7QVi4e_ny_63ToeUpf9QcBWg/exec";

const fields = ["australian","england","tackside","due"];

function amount(id){
  return Math.max(0, Number(document.getElementById(id).value) || 0);
}

function updateTotal(){
  const total = amount("australian") + amount("england") + amount("tackside");
  document.getElementById("total").textContent =
    total.toLocaleString("en-US");
}

fields.forEach(id => document.getElementById(id).addEventListener("input",updateTotal));

function clearAmounts(){
  fields.forEach(id => document.getElementById(id).value = 0);
  document.getElementById("date").value = new Date().toLocaleDateString("en-CA");
  updateTotal();
  document.getElementById("status").textContent = "Amounts cleared. Saved records remain unchanged.";
}

async function saveRecord(){
  const date = document.getElementById("date").value;
  if(!date){
    document.getElementById("status").textContent = "Please select a date.";
    return;
  }

  const data = {
    action:"save",
    date,
    australian:amount("australian"),
    england:amount("england"),
    tackside:amount("tackside"),
    due:amount("due")
  };

  data.total = data.australian + data.england + data.tackside;

  document.getElementById("saveBtn").disabled = true;
  document.getElementById("status").textContent = "Saving...";

  try{
    await fetch(API_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(data)
    });
    document.getElementById("status").textContent =
      "Save request sent. Please check Saved Records to confirm.";
    setTimeout(showRecords,1800);
  }catch(error){
    document.getElementById("status").textContent =
      "Could not send save request. Check internet and Apps Script deployment.";
  }finally{
    document.getElementById("saveBtn").disabled = false;
  }
}

async function showRecords(){
  const container = document.getElementById("records");
  container.textContent = "Loading records...";
  try{
    const response = await fetch(API_URL + "?action=records");
    const result = await response.json();
    const search = document.getElementById("searchDate").value;
    const records = (result.records || []).filter(r => !search || r.date === search);

    if(!records.length){
      container.textContent = "No records found.";
      return;
    }

    container.replaceChildren();
    records.slice().reverse().forEach(r => {
      const item = document.createElement("div");
      item.className = "record";
      const title = document.createElement("strong");
      title.textContent = r.date;
      item.appendChild(title);

      const details = document.createElement("p");
      details.textContent =
        "Australian: " + Number(r.australian || 0).toLocaleString("en-US") +
        " | England: " + Number(r.england || 0).toLocaleString("en-US") +
        " | Tackside: " + Number(r.tackside || 0).toLocaleString("en-US");
      item.appendChild(details);

      const total = document.createElement("p");
      total.textContent = "Total: " + Number(r.total || 0).toLocaleString("en-US");
      total.className = "total";
      item.appendChild(total);

      const due = document.createElement("p");
      due.textContent = "Due: " + Number(r.due || 0).toLocaleString("en-US");
      item.appendChild(due);
      container.appendChild(item);
    });
  }catch(error){
    container.textContent =
      "Could not load records. Check Apps Script deployment and access settings.";
  }
}

document.getElementById("date").value = new Date().toLocaleDateString("en-CA");
updateTotal();
showRecords();
</script>
</body>
</html>
