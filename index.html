
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Stake - Dematagoda</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f0f4f3;
  color:#18352e;
}
header{
  background:#123b35;
  color:white;
  text-align:center;
  padding:24px 12px;
}
header h1{margin:0 0 8px}
main{
  max-width:520px;
  margin:20px auto;
  padding:0 14px;
}
.card{
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:16px;
  box-shadow:0 3px 12px #0000000d;
}
label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}
input{
  width:100%;
  padding:13px;
  border:1px solid #cbd5d1;
  border-radius:9px;
  font-size:16px;
}
.total{
  background:#e0f4e8;
  padding:18px;
  border-radius:12px;
  margin-top:18px;
}
.total small{color:#315e49}
#total{
  font-size:28px;
  font-weight:bold;
  margin-top:8px;
  overflow-wrap:anywhere;
}
button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
  background:#16734e;
  color:white;
}
.secondary{background:#123b35}
.danger{background:#a83232}
.record{
  border:1px solid #dce5e0;
  border-radius:10px;
  padding:13px;
  margin-top:10px;
  overflow-wrap:anywhere;
}
.record button{font-size:14px;padding:10px}
.muted{color:#687871;font-size:13px}
</style>
</head>
<body>

<header>
  <h1>Daily Stake</h1>
  <div>DEMATAGODA</div>
</header>

<main>
  <section class="card">
    <h2>Enter Daily Stake</h2>

    <label for="date">Date</label>
    <input type="date" id="date">

    <label for="australian">Australian Stake (Rs.)</label>
    <input type="number" id="australian"
      min="0" step="0.01" placeholder="Enter Australian stake">

    <label for="england">England Stake (Rs.)</label>
    <input type="number" id="england"
      min="0" step="0.01" placeholder="Enter England stake">

    <label for="tackside">Tackside Stake (Rs.)</label>
    <input type="number" id="tackside"
      min="0" step="0.01" placeholder="Enter Tackside stake">

    <div class="total">
      <small>TOTAL STAKE</small>
      <div id="total">Rs. 0.00</div>
    </div>

    <button id="save">Save Daily Stake</button>
    <p id="status" class="muted" aria-live="polite"></p>
  </section>

  <section class="card">
    <h2>Previous Records</h2>
    <label for="searchDate">Find by Date</label>
    <input type="date" id="searchDate">
    <button class="secondary" id="search">Search Records</button>
    <button class="secondary" id="all">Show All Records</button>
    <div id="records"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

const today = new Date();
const localDate = [
  today.getFullYear(),
  String(today.getMonth()+1).padStart(2,"0"),
  String(today.getDate()).padStart(2,"0")
].join("-");

$("date").value = localDate;
$("searchDate").value = localDate;

const money = n => "Rs. " + n.toLocaleString(
  "en-LK",{minimumFractionDigits:2,maximumFractionDigits:2}
);

function amount(id){
  const el = $(id);
  if(el.value.trim() === "") return 0;
  const n = Number(el.value);
  return Number.isFinite(n) && n >= 0 ? n : NaN;
}

function values(){
  return {
    australian: amount("australian"),
    england: amount("england"),
    tackside: amount("tackside")
  };
}

function totalOf(v){
  return v.australian + v.england + v.tackside;
}

function updateTotal(){
  const v = values();
  $("total").textContent =
    Object.values(v).some(n => !Number.isFinite(n))
      ? "Check amounts"
      : money(totalOf(v));
}

["australian","england","tackside"].forEach(id=>{
  $(id).addEventListener("input",updateTotal);
});

// Temporary local storage until Firebase is connected.
// This version does NOT sync to other phones.
const storageKey = "dematagodaDailyStakeV1";

function readRecords(){
  try {
    const r = JSON.parse(localStorage.getItem(storageKey) || "{}");
    return r && typeof r === "object" && !Array.isArray(r) ? r : {};
  } catch {
    return {};
  }
}

function writeRecords(records){
  localStorage.setItem(storageKey,JSON.stringify(records));
}

function save(){
  const date = $("date").value;
  const v = values();

  if(!date){
    $("status").textContent = "Please select a date.";
    return;
  }
  if(Object.values(v).some(n => !Number.isFinite(n))){
    $("status").textContent = "Enter valid non-negative amounts.";
    return;
  }

  try {
    const records = readRecords();
    records[date] = {...v,total:totalOf(v),date};
    writeRecords(records);
    $("status").textContent = "Saved on this device for " + date + ".";
    renderRecords();
  } catch {
    $("status").textContent = "Could not save. Check browser storage.";
  }
}

function renderRecords(filterDate=""){
  const records = readRecords();
  const dates = Object.keys(records)
    .filter(d=>!filterDate || d===filterDate)
    .sort((a,b)=>b.localeCompare(a));

  const root = $("records");
  root.replaceChildren();

  if(!dates.length){
    const p = document.createElement("p");
    p.className = "muted";
    p.textContent = "No saved records found.";
    root.appendChild(p);
    return;
  }

  dates.forEach(date=>{
    const r = records[date];
    const box = document.createElement("div");
    box.className = "record";

    const title = document.createElement("strong");
    title.textContent = "Daily Stake - " + date;
    box.appendChild(title);

    const details = document.createElement("p");
    details.textContent =
      "Australian: " + money(r.australian) +
      "\nEngland: " + money(r.england) +
      "\nTackside: " + money(r.tackside) +
      "\nTOTAL: " + money(r.total);
    details.style.whiteSpace = "pre-line";
    box.appendChild(details);

    const edit = document.createElement("button");
    edit.className = "secondary";
    edit.textContent = "Edit This Record";
    edit.addEventListener("click",()=>{
      $("date").value = date;
      $("australian").value = r.australian;
      $("england").value = r.england;
      $("tackside").value = r.tackside;
      updateTotal();
      window.scrollTo({top:0,behavior:"smooth"});
    });
    box.appendChild(edit);

    const del = document.createElement("button");
    del.className = "danger";
    del.textContent = "Delete Record";
    del.addEventListener("click",()=>{
      if(!confirm("Delete record for " + date + "?")) return;
      const latest = readRecords();
      delete latest[date];
      writeRecords(latest);
      renderRecords(filterDate);
    });
    box.appendChild(del);
    root.appendChild(box);
  });
}

$("save").addEventListener("click",save);
$("search").addEventListener("click",()=>{
  renderRecords($("searchDate").value);
});
$("all").addEventListener("click",()=>renderRecords());

updateTotal();
renderRecords();
</script>
</body>
</html>
